# No `databases:` block here on purpose -- Render's own free Postgres tier
# expires and is deleted after 30 days, which is a bad fit for a project
# meant to stay live. The database instead lives on Neon (neon.tech), which
# has a genuinely non-expiring free tier; its connection string is set below
# as a plain secret env var (`sync: false` means Render won't try to manage
# its value -- you paste it in once on the dashboard).
services:
  - type: web
    name: leetcoach-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: "https://REPLACE-WITH-YOUR-VERCEL-URL.vercel.app"
