databases:
  - name: leetcoach-db
    plan: free
    databaseName: leetcoach
    user: leetcoach

services:
  - type: web
    name: leetcoach-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: leetcoach-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: "https://REPLACE-WITH-YOUR-VERCEL-URL.vercel.app"
